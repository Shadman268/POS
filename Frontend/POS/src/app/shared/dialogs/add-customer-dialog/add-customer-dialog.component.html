<form #customerForm="ngForm" (ngSubmit)="onSubmit()">
  <h2 mat-dialog-title>Add Customer</h2>

  <mat-dialog-content class="dialog-content">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput name="name" [(ngModel)]="form.name" required maxlength="200" autocomplete="name" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Phone No</mat-label>
      <input
        matInput
        name="phone"
        [(ngModel)]="form.phone"
        required
        maxlength="30"
        autocomplete="tel"
        placeholder="e.g. 01700000000"
      />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions class="actions-right">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="!customerForm.valid">
      Save
    </button>
  </mat-dialog-actions>
</form>
