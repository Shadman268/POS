<form (ngSubmit)="onSubmit()">
  <h2 mat-dialog-title>Return</h2>
  <mat-dialog-content>
    <p class="hint">Enter the receipt number to load it in the journal.</p>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Receipt #</mat-label>
      <input
        matInput
        name="receiptNo"
        [(ngModel)]="receiptNo"
        autocomplete="off"
        autofocus
      />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions class="actions-right">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="!receiptNo.trim()">
      Load receipt
    </button>
  </mat-dialog-actions>
</form>
