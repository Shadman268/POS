<form #priceForm="ngForm" (ngSubmit)="onSubmit()">
  <h2 mat-dialog-title>Set selling price</h2>
  <mat-dialog-content>
    <p class="product-name">{{ data.productName }}</p>
    <p class="generic-name" *ngIf="data.genericName">{{ data.genericName }}</p>
    <p class="hint">This price will be saved for your shop and used for future sales.</p>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Selling price (৳)</mat-label>
      <input
        matInput
        type="number"
        name="price"
        [(ngModel)]="price"
        min="0.01"
        step="0.01"
        required
        autofocus
      />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions class="actions-right">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="!priceForm.valid || (price ?? 0) <= 0">
      Save &amp; add
    </button>
  </mat-dialog-actions>
</form>
