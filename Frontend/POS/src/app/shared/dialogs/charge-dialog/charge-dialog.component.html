<div class="charge-dialog">
  <h2 mat-dialog-title>Charge</h2>

  <mat-dialog-content>
    <div class="due-row">
      <span>Amount due</span>
      <strong>৳{{ data.total | amount }}</strong>
    </div>

    <label class="field-label" for="cash-received">Cash received</label>
    <input
      id="cash-received"
      class="cash-input"
      type="number"
      name="cashReceived"
      [(ngModel)]="cashReceived"
      min="0"
      step="0.1"
      autofocus
      placeholder="0"
    />

    <div class="notes">
      <button type="button" class="note-btn exact" (click)="setExact()">Exact</button>
      <button
        type="button"
        class="note-btn"
        *ngFor="let note of notes"
        (click)="addNote(note)"
      >
        ৳{{ note }}
      </button>
    </div>

    <div class="change-row">
      <span>Change</span>
      <strong [class.ready]="canProcess">৳{{ changeAmount | amount }}</strong>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="actions">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button
      mat-raised-button
      color="primary"
      type="button"
      [disabled]="!canProcess"
      (click)="onProcess()"
    >
      Process
    </button>
  </mat-dialog-actions>
</div>
