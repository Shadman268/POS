<form #productForm="ngForm" (ngSubmit)="onSubmit()">
  <h2 mat-dialog-title>Add Product</h2>

  <mat-dialog-content class="dialog-content">
    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput name="name" [(ngModel)]="form.name" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Generic Name</mat-label>
        <input matInput name="genericName" [(ngModel)]="form.genericName" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Strength</mat-label>
        <input matInput name="strength" [(ngModel)]="form.strength" placeholder="e.g. 500mg" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Dosage Form</mat-label>
        <input matInput name="dosageForm" [(ngModel)]="form.dosageForm" placeholder="e.g. Tablet" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Category</mat-label>
        <input matInput name="category" [(ngModel)]="form.category" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Brand</mat-label>
        <input matInput name="brand" [(ngModel)]="form.brand" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Unit</mat-label>
        <input matInput name="unit" [(ngModel)]="form.unit" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Barcode</mat-label>
        <input matInput name="barcode" [(ngModel)]="form.barcode" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Selling Price (৳)</mat-label>
        <input matInput type="number" name="sellingPrice" [(ngModel)]="form.sellingPrice" min="0.01" step="0.01" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Cost Price (৳)</mat-label>
        <input matInput type="number" name="costPrice" [(ngModel)]="form.costPrice" min="0" step="0.01" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Local SKU</mat-label>
        <input matInput name="localSku" [(ngModel)]="form.localSku" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Initial Stock</mat-label>
        <input matInput type="number" name="initialStock" [(ngModel)]="form.initialStock" min="0" />
      </mat-form-field>

      <mat-form-field appearance="outline" *ngIf="form.isStockTracked">
        <mat-label>Batch Number</mat-label>
        <input matInput name="batchNumber" [(ngModel)]="form.batchNumber" />
      </mat-form-field>

      <mat-form-field appearance="outline" *ngIf="form.isStockTracked">
        <mat-label>Expiry Date</mat-label>
        <input matInput type="date" name="expiryDate" [(ngModel)]="form.expiryDate" />
      </mat-form-field>
    </div>

    <mat-checkbox name="isStockTracked" [(ngModel)]="form.isStockTracked">
      Track stock for this medicine
    </mat-checkbox>
  </mat-dialog-content>

  <mat-dialog-actions class="actions-right">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="!productForm.valid">
      Save
    </button>
  </mat-dialog-actions>
</form>
