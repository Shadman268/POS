<div class="product-panel">
  <div class="filters">
    <select class="filter-select" [(ngModel)]="selectedCategory" (change)="onCategoryChange()">
      <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
    </select>
    <select class="filter-select" [(ngModel)]="selectedBrand" (change)="onBrandChange()">
      <option *ngFor="let brand of brands" [value]="brand">{{ brand }}</option>
    </select>
  </div>

  <div class="product-grid">
    <div
      class="product-card"
      *ngFor="let product of filteredProducts"
      (click)="selectProduct(product)"
    >
      <span
        class="stock-badge"
        *ngIf="maintainStock"
        [class.good]="stockLevel(product.stockQuantity ?? 0) === 'good'"
        [class.low]="stockLevel(product.stockQuantity ?? 0) === 'low'"
        [class.out]="stockLevel(product.stockQuantity ?? 0) === 'out'"
      >
        Stock: {{ product.stockQuantity ?? 0 }}
      </span>

      <div class="card-info">
        <span class="name">{{ product.productName }}</span>
        <span class="generic" *ngIf="product.genericName">{{ product.genericName }}</span>
      </div>

      <span class="price" [class.set-price]="product.requiresPrice || +product.price <= 0">
        {{ (product.requiresPrice || +product.price <= 0) ? 'Set price' : ('৳' + product.price) }}
      </span>
    </div>

    <div class="empty-grid" *ngIf="filteredProducts.length === 0">
      <mat-icon>inventory_2</mat-icon>
      <p>No products found</p>
    </div>
  </div>
</div>
