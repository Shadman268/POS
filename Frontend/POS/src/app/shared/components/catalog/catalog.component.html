<div class="page-shell">
  <div class="page-header">
    <div class="header-text">
      <h1>Catalog</h1>
      <p>Global medicine catalog. Upload a CSV file to import up to 20,000 medicines.</p>
    </div>
    <div class="header-actions">
      <input
        #fileInput
        type="file"
        accept=".csv"
        hidden
        (change)="onFileSelected($event)"
      />
      <button
        mat-raised-button
        color="primary"
        class="import-btn"
        (click)="triggerFileSelect()"
        [disabled]="importing"
      >
        <mat-icon>{{ importing ? 'hourglass_top' : 'upload_file' }}</mat-icon>
        {{ importing ? 'Importing...' : 'Import CSV' }}
      </button>
    </div>
  </div>

  <div class="import-feedback success" *ngIf="importMessage">{{ importMessage }}</div>
  <div class="import-feedback error" *ngIf="importError">{{ importError }}</div>

  <div class="toolbar" *ngIf="hasData">
    <div class="search-box">
      <mat-icon>search</mat-icon>
      <input
        type="text"
        placeholder="Search name, generic name, or barcode..."
        [(ngModel)]="search"
        (keyup.enter)="onSearch()"
      />
      <button mat-stroked-button (click)="onSearch()">Search</button>
    </div>
    <span class="record-count">{{ totalCount | number }} medicines</span>
  </div>

  <div class="table-card">
    <div class="table-wrap">
      <table class="catalog-table">
        <thead>
          <tr>
            <th *ngFor="let col of columns">{{ col.label }}</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="loading">
            <td [attr.colspan]="columns.length + 1" class="state-cell">
              <mat-spinner diameter="28"></mat-spinner>
              <span>Loading catalog...</span>
            </td>
          </tr>
          <tr *ngFor="let medicine of medicines">
            <td *ngFor="let col of columns">{{ displayValue(medicine, col.key) }}</td>
            <td class="actions-col">
              <button
                mat-icon-button
                color="warn"
                (click)="deleteMedicine(medicine)"
                [disabled]="deletingId === medicine.id"
                aria-label="Delete medicine"
              >
                <mat-icon>{{ deletingId === medicine.id ? 'hourglass_top' : 'delete' }}</mat-icon>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pagination" *ngIf="hasData && !loading">
      <div class="page-size">
        <label>Rows</label>
        <select [(ngModel)]="pageSize" (change)="onPageSizeChange()">
          <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
        </select>
      </div>
      <div class="page-controls">
        <button mat-stroked-button (click)="goToPage(page - 1)" [disabled]="page <= 1">Previous</button>
        <span>Page {{ page }} of {{ totalPages }}</span>
        <button mat-stroked-button (click)="goToPage(page + 1)" [disabled]="page >= totalPages">Next</button>
      </div>
    </div>
  </div>
</div>
