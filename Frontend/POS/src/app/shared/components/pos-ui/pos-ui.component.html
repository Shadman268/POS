<div class="pos-page">
  <div class="pos-body">
    <div class="products-panel" [class.mobile-hidden]="mobileView === 'journal'">
      <app-product-view></app-product-view>
    </div>

    <div class="journal-panel" [class.mobile-hidden]="mobileView === 'products'">
      <app-journal (addProductRequest)="addProduct()"></app-journal>
    </div>
  </div>

  <div class="mobile-tabs">
    <button class="tab-btn" [class.active]="mobileView === 'products'" (click)="mobileView = 'products'">
      <mat-icon>medication</mat-icon>
      Products
    </button>
    <button class="tab-btn" [class.active]="mobileView === 'journal'" (click)="mobileView = 'journal'">
      <mat-icon>receipt_long</mat-icon>
      Journal
      <span class="badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
    </button>
  </div>
</div>
